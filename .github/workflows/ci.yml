name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-rls:
    name: RLS Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: winlabs_analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://wla_test:wla_test@localhost:5432/winlabs_analytics_test
      DIRECT_URL: postgresql://wla_test:wla_test@localhost:5432/winlabs_analytics_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create non-superuser DB role for RLS tests
        # Los superusuarios de Postgres bypasean RLS incluso con FORCE ROW LEVEL SECURITY.
        # wla_test como NOSUPERUSER garantiza que las policies apliquen correctamente.
        run: |
          psql postgresql://postgres:postgres@localhost:5432/winlabs_analytics_test \
            -c "CREATE USER wla_test WITH PASSWORD 'wla_test' NOSUPERUSER NOCREATEDB NOCREATEROLE;" \
            -c "GRANT ALL PRIVILEGES ON DATABASE winlabs_analytics_test TO wla_test;" \
            -c "GRANT CREATE ON SCHEMA public TO wla_test;"

      - name: Run Prisma migrations on test DB
        run: pnpm --filter @wla/db db:migrate:test

      - name: Run RLS tests
        run: pnpm --filter @wla/db test

  # Lint, typecheck y build los cubre Vercel en cada deploy.
  # E2E deshabilitado hasta tener staging con deploy automático.
